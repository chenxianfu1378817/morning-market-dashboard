<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>晨间看板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero"><p class="eyebrow">MORNING DASHBOARD</p><h1>早安，今天看什么？</h1><p id="updated">正在读取最新数据…</p><button id="refresh" type="button">刷新页面</button><p id="refresh-status" class="sub"></p></header>
    <section><div class="section-title"><h2>天气</h2><span>广西 · 广东</span></div><div id="weather" class="grid"></div></section>
    <section><div class="section-title"><h2>今日提醒</h2><span>自动判断</span></div><div id="alerts" class="notice-list"></div><p id="summary" class="summary"></p></section>
    <section><div class="section-title"><h2>国际原油</h2><span>美元 / 桶</span></div><div id="oil" class="grid"></div></section>
    <section><div class="section-title"><h2>原油走势</h2><span>最近 7 天</span></div><div id="chart" class="chart-card"></div></section>
    <footer>数据仅供参考 · 页面数据由 GitHub Actions 自动更新</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
